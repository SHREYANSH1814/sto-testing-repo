      - name: Run Semgrep no-default-cli-flags scan with named target
        id: sto-scan-no-default-cli-flags
        if: always()
        uses: ./.github/actions/harness-sto
        with:
          harness-token: ${{ secrets.HARNESS_TOKEN }}
          harness-org-id: ${{ inputs.harness-org-id }}
          harness-project-id: ${{ inputs.harness-project-id }}
          harness-domain: ${{ inputs.harness-domain }}

          scanner: semgrep
          scan-mode: orchestration
          scan-config: no-default-cli-flags
          target-type: repository
          workspace: .
          docker-image-tag: "dev"
          target-name: "shreyansh/semgrepnodefaultcliflags"
          target-variant: "main"
          output-file: scan-output-no-default-cli-flags.env
          show-summary: 'true'
      - name: Use scan output variables
        if: always()
        shell: bash
        run: |
          echo "===== STO Scan Output Variables (scan-third-party-dependencies default target) ====="
          echo "Scan ID: ${{ steps.sto-scan-third-party-default.outputs.scan-id }}"
          echo "Status: ${{ steps.sto-scan-third-party-default.outputs.status }}"
          echo "Total Issues: ${{ steps.sto-scan-third-party-default.outputs.total-issues }}"
          echo "Critical: ${{ steps.sto-scan-third-party-default.outputs.critical }}"
          echo "High: ${{ steps.sto-scan-third-party-default.outputs.high }}"
          echo "Medium: ${{ steps.sto-scan-third-party-default.outputs.medium }}"
          echo "Low: ${{ steps.sto-scan-third-party-default.outputs.low }}"
          echo "Info: ${{ steps.sto-scan-third-party-default.outputs.info }}"
          echo "Output File Path: ${{ steps.sto-scan-third-party-default.outputs.output-file-path }}"

          echo "===== STO Scan Output Variables (scan-third-party-dependencies) ====="
          echo "Scan ID: ${{ steps.sto-scan-third-party.outputs.scan-id }}"
          echo "Status: ${{ steps.sto-scan-third-party.outputs.status }}"
          echo "Total Issues: ${{ steps.sto-scan-third-party.outputs.total-issues }}"
          echo "Critical: ${{ steps.sto-scan-third-party.outputs.critical }}"
          echo "High: ${{ steps.sto-scan-third-party.outputs.high }}"
          echo "Medium: ${{ steps.sto-scan-third-party.outputs.medium }}"
          echo "Low: ${{ steps.sto-scan-third-party.outputs.low }}"
          echo "Info: ${{ steps.sto-scan-third-party.outputs.info }}"
          echo "Output File Path: ${{ steps.sto-scan-third-party.outputs.output-file-path }}"

          echo "===== STO Scan Output Variables (auto-and-ported-security-tools-except-p-gitleaks default target) ====="
          echo "Scan ID: ${{ steps.sto-scan-auto-ported-except-gitleaks-default.outputs.scan-id }}"
          echo "Status: ${{ steps.sto-scan-auto-ported-except-gitleaks-default.outputs.status }}"
          echo "Total Issues: ${{ steps.sto-scan-auto-ported-except-gitleaks-default.outputs.total-issues }}"
          echo "Critical: ${{ steps.sto-scan-auto-ported-except-gitleaks-default.outputs.critical }}"
          echo "High: ${{ steps.sto-scan-auto-ported-except-gitleaks-default.outputs.high }}"
          echo "Medium: ${{ steps.sto-scan-auto-ported-except-gitleaks-default.outputs.medium }}"
          echo "Low: ${{ steps.sto-scan-auto-ported-except-gitleaks-default.outputs.low }}"
          echo "Info: ${{ steps.sto-scan-auto-ported-except-gitleaks-default.outputs.info }}"
          echo "Output File Path: ${{ steps.sto-scan-auto-ported-except-gitleaks-default.outputs.output-file-path }}"

          echo "===== STO Scan Output Variables (auto-and-ported-security-tools-except-p-gitleaks) ====="
          echo "Scan ID: ${{ steps.sto-scan-auto-ported-except-gitleaks.outputs.scan-id }}"
          echo "Status: ${{ steps.sto-scan-auto-ported-except-gitleaks.outputs.status }}"
          echo "Total Issues: ${{ steps.sto-scan-auto-ported-except-gitleaks.outputs.total-issues }}"
          echo "Critical: ${{ steps.sto-scan-auto-ported-except-gitleaks.outputs.critical }}"
          echo "High: ${{ steps.sto-scan-auto-ported-except-gitleaks.outputs.high }}"
          echo "Medium: ${{ steps.sto-scan-auto-ported-except-gitleaks.outputs.medium }}"
          echo "Low: ${{ steps.sto-scan-auto-ported-except-gitleaks.outputs.low }}"
          echo "Info: ${{ steps.sto-scan-auto-ported-except-gitleaks.outputs.info }}"
          echo "Output File Path: ${{ steps.sto-scan-auto-ported-except-gitleaks.outputs.output-file-path }}"

          echo "===== STO Scan Output Variables (auto-and-ported-security-tools default target) ====="
          echo "Scan ID: ${{ steps.sto-scan-auto-ported-default.outputs.scan-id }}"
          echo "Status: ${{ steps.sto-scan-auto-ported-default.outputs.status }}"
          echo "Total Issues: ${{ steps.sto-scan-auto-ported-default.outputs.total-issues }}"
          echo "Critical: ${{ steps.sto-scan-auto-ported-default.outputs.critical }}"
          echo "High: ${{ steps.sto-scan-auto-ported-default.outputs.high }}"
          echo "Medium: ${{ steps.sto-scan-auto-ported-default.outputs.medium }}"
          echo "Low: ${{ steps.sto-scan-auto-ported-default.outputs.low }}"
          echo "Info: ${{ steps.sto-scan-auto-ported-default.outputs.info }}"
          echo "Output File Path: ${{ steps.sto-scan-auto-ported-default.outputs.output-file-path }}"

          echo "===== STO Scan Output Variables (auto-and-ported-security-tools) ====="
          echo "Scan ID: ${{ steps.sto-scan-auto-ported.outputs.scan-id }}"
          echo "Status: ${{ steps.sto-scan-auto-ported.outputs.status }}"
          echo "Total Issues: ${{ steps.sto-scan-auto-ported.outputs.total-issues }}"
          echo "Critical: ${{ steps.sto-scan-auto-ported.outputs.critical }}"
          echo "High: ${{ steps.sto-scan-auto-ported.outputs.high }}"
          echo "Medium: ${{ steps.sto-scan-auto-ported.outputs.medium }}"
          echo "Low: ${{ steps.sto-scan-auto-ported.outputs.low }}"
          echo "Info: ${{ steps.sto-scan-auto-ported.outputs.info }}"
