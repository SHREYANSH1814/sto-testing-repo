          echo "Status: ${{ steps.sto-scan-auto-only-default.outputs.status }}"
          echo "Total Issues: ${{ steps.sto-scan-auto-only-default.outputs.total-issues }}"
          echo "Critical: ${{ steps.sto-scan-auto-only-default.outputs.critical }}"
          echo "High: ${{ steps.sto-scan-auto-only-default.outputs.high }}"
          echo "Medium: ${{ steps.sto-scan-auto-only-default.outputs.medium }}"
          echo "Low: ${{ steps.sto-scan-auto-only-default.outputs.low }}"
          echo "Info: ${{ steps.sto-scan-auto-only-default.outputs.info }}"
