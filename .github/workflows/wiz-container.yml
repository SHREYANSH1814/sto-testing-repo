name: Wiz Container Security Scan

on:
  workflow_dispatch:
    inputs:
      harness-org-id:
        description: 'Harness Organization ID'
        required: true
        type: string
      harness-project-id:
        description: 'Harness Project ID'
        required: true
        type: string
      harness-domain:
        description: 'Harness domain (e.g., https://app.harness.io)'
        required: false
        type: string
        default: 'https://app.harness.io'

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Run Wiz private registry scan with default target
        id: sto-scan-default
        uses: ./.github/actions/harness-sto
        with:
          harness-token: ${{ secrets.HARNESS_TOKEN }}
          harness-org-id: ${{ inputs.harness-org-id }}
          harness-project-id: ${{ inputs.harness-project-id }}
          harness-domain: ${{ inputs.harness-domain }}

          scanner: wiz
          scan-mode: orchestration
          scan-config: default
          target-type: container
          image-name: "nirocr/nodegoat"
          image-tag: "latest"
          image-type: docker_v2
          image-access-id: ${{ secrets.PRIVATE_DOCKER_ACCESS_ID }}
          image-access-token: ${{ secrets.PRIVATE_DOCKER_ACCESS_TOKEN }}
          scanner-access-id: ${{ secrets.WIZ_ACCESS_ID }}
          scanner-access-token: ${{ secrets.WIZ_ACCESS_TOKEN }}
          docker-image-tag: "dev"
          output-file: scan-output-default.env
          show-summary: 'true'

      - name: Run Wiz private registry scan with named target
        id: sto-scan-container
        if: always()
        uses: ./.github/actions/harness-sto
        with:
          harness-token: ${{ secrets.HARNESS_TOKEN }}
          harness-org-id: ${{ inputs.harness-org-id }}
          harness-project-id: ${{ inputs.harness-project-id }}
          harness-domain: ${{ inputs.harness-domain }}

          scanner: wiz
          scan-mode: orchestration
          scan-config: default
          target-type: container
          image-name: "nirocr/nodegoat"
          image-tag: "latest"
          image-type: docker_v2
          image-access-id: ${{ secrets.PRIVATE_DOCKER_ACCESS_ID }}
          image-access-token: ${{ secrets.PRIVATE_DOCKER_ACCESS_TOKEN }}
          scanner-access-id: ${{ secrets.WIZ_ACCESS_ID }}
          scanner-access-token: ${{ secrets.WIZ_ACCESS_TOKEN }}
          target-name: "shreyansh/wizcontainer"
          target-variant: "latest"
          docker-image-tag: "dev"
          output-file: scan-output-container.env
          show-summary: 'true'

      - name: Run Wiz public Docker Hub scan with default target
        id: sto-scan-dockerhub-default
        if: always()
        uses: ./.github/actions/harness-sto
        with:
          harness-token: ${{ secrets.HARNESS_TOKEN }}
          harness-org-id: ${{ inputs.harness-org-id }}
          harness-project-id: ${{ inputs.harness-project-id }}
          harness-domain: ${{ inputs.harness-domain }}

          scanner: wiz
          scan-mode: orchestration
          scan-config: default
          target-type: container
          image-name: "nginx"
          image-tag: "latest"
          image-domain: "docker.io"
          image-type: docker_v2
          scanner-access-id: ${{ secrets.WIZ_ACCESS_ID }}
          scanner-access-token: ${{ secrets.WIZ_ACCESS_TOKEN }}
          docker-image-tag: "dev"
          output-file: scan-output-dockerhub-default.env
          show-summary: 'true'

      - name: Run Wiz public Docker Hub scan with named target
        id: sto-scan-dockerhub
        if: always()
        uses: ./.github/actions/harness-sto
        with:
          harness-token: ${{ secrets.HARNESS_TOKEN }}
          harness-org-id: ${{ inputs.harness-org-id }}
          harness-project-id: ${{ inputs.harness-project-id }}
          harness-domain: ${{ inputs.harness-domain }}

          scanner: wiz
          scan-mode: orchestration
          scan-config: default
          target-type: container
          image-name: "nginx"
          image-tag: "latest"
          image-domain: "docker.io"
          image-type: docker_v2
          scanner-access-id: ${{ secrets.WIZ_ACCESS_ID }}
          scanner-access-token: ${{ secrets.WIZ_ACCESS_TOKEN }}
          target-name: "shreyansh/wizpublicdockerhub"
          target-variant: "latest"
          docker-image-tag: "dev"
          output-file: scan-output-dockerhub.env
          show-summary: 'true'

      - name: Build local Docker image
        if: always()
        run: |
          docker pull node:14
          docker tag node:14 sg123:${{ github.sha }}

      - name: Run Wiz local image scan with default target
        id: sto-scan-local-default
        if: always()
        uses: ./.github/actions/harness-sto
        with:
          harness-token: ${{ secrets.HARNESS_TOKEN }}
          harness-org-id: ${{ inputs.harness-org-id }}
          harness-project-id: ${{ inputs.harness-project-id }}
          harness-domain: ${{ inputs.harness-domain }}

          scanner: wiz
          scan-mode: orchestration
          scan-config: default
          target-type: container
          image-name: "sg123"
          image-tag: ${{ github.sha }}
          image-type: local_image
          scanner-access-id: ${{ secrets.WIZ_ACCESS_ID }}
          scanner-access-token: ${{ secrets.WIZ_ACCESS_TOKEN }}
          docker-image-tag: "dev"
          output-file: scan-output-local-default.env
          show-summary: 'true'

      - name: Run Wiz local image scan with named target
        id: sto-scan-local
        if: always()
        uses: ./.github/actions/harness-sto
        with:
          harness-token: ${{ secrets.HARNESS_TOKEN }}
          harness-org-id: ${{ inputs.harness-org-id }}
          harness-project-id: ${{ inputs.harness-project-id }}
          harness-domain: ${{ inputs.harness-domain }}

          scanner: wiz
          scan-mode: orchestration
          scan-config: default
          target-type: container
          image-name: "sg123"
          image-tag: ${{ github.sha }}
          image-type: local_image
          scanner-access-id: ${{ secrets.WIZ_ACCESS_ID }}
          scanner-access-token: ${{ secrets.WIZ_ACCESS_TOKEN }}
          target-name: "shreyansh/wizlocalimage"
          target-variant: ${{ github.sha }}
          docker-image-tag: "dev"
          output-file: scan-output-local.env
          show-summary: 'true'

      - name: Use scan output variables
        if: always()
        shell: bash
        run: |
          echo "===== STO Scan Output Variables (private default) ====="
          echo "Scan ID: ${{ steps.sto-scan-default.outputs.scan-id }}"
          echo "Status: ${{ steps.sto-scan-default.outputs.status }}"
          echo "Total Issues: ${{ steps.sto-scan-default.outputs.total-issues }}"
          echo "Critical: ${{ steps.sto-scan-default.outputs.critical }}"
          echo "High: ${{ steps.sto-scan-default.outputs.high }}"
          echo "Medium: ${{ steps.sto-scan-default.outputs.medium }}"
          echo "Low: ${{ steps.sto-scan-default.outputs.low }}"
          echo "Info: ${{ steps.sto-scan-default.outputs.info }}"
          echo "Output File Path: ${{ steps.sto-scan-default.outputs.output-file-path }}"

          echo "===== STO Scan Output Variables (private named) ====="
          echo "Scan ID: ${{ steps.sto-scan-container.outputs.scan-id }}"
          echo "Status: ${{ steps.sto-scan-container.outputs.status }}"
          echo "Total Issues: ${{ steps.sto-scan-container.outputs.total-issues }}"
          echo "Critical: ${{ steps.sto-scan-container.outputs.critical }}"
          echo "High: ${{ steps.sto-scan-container.outputs.high }}"
          echo "Medium: ${{ steps.sto-scan-container.outputs.medium }}"
          echo "Low: ${{ steps.sto-scan-container.outputs.low }}"
          echo "Info: ${{ steps.sto-scan-container.outputs.info }}"
          echo "Output File Path: ${{ steps.sto-scan-container.outputs.output-file-path }}"

          echo "===== STO Scan Output Variables (public Docker Hub default) ====="
          echo "Scan ID: ${{ steps.sto-scan-dockerhub-default.outputs.scan-id }}"
          echo "Status: ${{ steps.sto-scan-dockerhub-default.outputs.status }}"
          echo "Total Issues: ${{ steps.sto-scan-dockerhub-default.outputs.total-issues }}"
          echo "Critical: ${{ steps.sto-scan-dockerhub-default.outputs.critical }}"
          echo "High: ${{ steps.sto-scan-dockerhub-default.outputs.high }}"
          echo "Medium: ${{ steps.sto-scan-dockerhub-default.outputs.medium }}"
          echo "Low: ${{ steps.sto-scan-dockerhub-default.outputs.low }}"
          echo "Info: ${{ steps.sto-scan-dockerhub-default.outputs.info }}"
          echo "Output File Path: ${{ steps.sto-scan-dockerhub-default.outputs.output-file-path }}"

          echo "===== STO Scan Output Variables (public Docker Hub named) ====="
          echo "Scan ID: ${{ steps.sto-scan-dockerhub.outputs.scan-id }}"
          echo "Status: ${{ steps.sto-scan-dockerhub.outputs.status }}"
          echo "Total Issues: ${{ steps.sto-scan-dockerhub.outputs.total-issues }}"
          echo "Critical: ${{ steps.sto-scan-dockerhub.outputs.critical }}"
          echo "High: ${{ steps.sto-scan-dockerhub.outputs.high }}"
          echo "Medium: ${{ steps.sto-scan-dockerhub.outputs.medium }}"
          echo "Low: ${{ steps.sto-scan-dockerhub.outputs.low }}"
          echo "Info: ${{ steps.sto-scan-dockerhub.outputs.info }}"
          echo "Output File Path: ${{ steps.sto-scan-dockerhub.outputs.output-file-path }}"

          echo "===== STO Scan Output Variables (local image default) ====="
          echo "Scan ID: ${{ steps.sto-scan-local-default.outputs.scan-id }}"
          echo "Status: ${{ steps.sto-scan-local-default.outputs.status }}"
          echo "Total Issues: ${{ steps.sto-scan-local-default.outputs.total-issues }}"
          echo "Critical: ${{ steps.sto-scan-local-default.outputs.critical }}"
          echo "High: ${{ steps.sto-scan-local-default.outputs.high }}"
          echo "Medium: ${{ steps.sto-scan-local-default.outputs.medium }}"
          echo "Low: ${{ steps.sto-scan-local-default.outputs.low }}"
          echo "Info: ${{ steps.sto-scan-local-default.outputs.info }}"
          echo "Output File Path: ${{ steps.sto-scan-local-default.outputs.output-file-path }}"

          echo "===== STO Scan Output Variables (local image named) ====="
          echo "Scan ID: ${{ steps.sto-scan-local.outputs.scan-id }}"
          echo "Status: ${{ steps.sto-scan-local.outputs.status }}"
          echo "Total Issues: ${{ steps.sto-scan-local.outputs.total-issues }}"
          echo "Critical: ${{ steps.sto-scan-local.outputs.critical }}"
          echo "High: ${{ steps.sto-scan-local.outputs.high }}"
          echo "Medium: ${{ steps.sto-scan-local.outputs.medium }}"
          echo "Low: ${{ steps.sto-scan-local.outputs.low }}"
          echo "Info: ${{ steps.sto-scan-local.outputs.info }}"
          echo "Output File Path: ${{ steps.sto-scan-local.outputs.output-file-path }}"

      - name: Archive scan output (private default)
        if: always() && steps.sto-scan-default.outputs.output-file-path != ''
        uses: actions/upload-artifact@v4
        with:
          name: sto-scan-results-default
          path: ${{ steps.sto-scan-default.outputs.output-file-path }}
          retention-days: 1

      - name: Archive scan output (private named)
        if: always() && steps.sto-scan-container.outputs.output-file-path != ''
        uses: actions/upload-artifact@v4
        with:
          name: sto-scan-results-container
          path: ${{ steps.sto-scan-container.outputs.output-file-path }}
          retention-days: 1

      - name: Archive scan output (public Docker Hub default)
        if: always() && steps.sto-scan-dockerhub-default.outputs.output-file-path != ''
        uses: actions/upload-artifact@v4
        with:
          name: sto-scan-results-dockerhub-default
          path: ${{ steps.sto-scan-dockerhub-default.outputs.output-file-path }}
          retention-days: 1

      - name: Archive scan output (public Docker Hub named)
        if: always() && steps.sto-scan-dockerhub.outputs.output-file-path != ''
        uses: actions/upload-artifact@v4
        with:
          name: sto-scan-results-dockerhub
          path: ${{ steps.sto-scan-dockerhub.outputs.output-file-path }}
          retention-days: 1

      - name: Archive scan output (local image default)
        if: always() && steps.sto-scan-local-default.outputs.output-file-path != ''
        uses: actions/upload-artifact@v4
        with:
          name: sto-scan-results-local-default
          path: ${{ steps.sto-scan-local-default.outputs.output-file-path }}
          retention-days: 1

      - name: Archive scan output (local image named)
        if: always() && steps.sto-scan-local.outputs.output-file-path != ''
        uses: actions/upload-artifact@v4
        with:
          name: sto-scan-results-local
          path: ${{ steps.sto-scan-local.outputs.output-file-path }}
          retention-days: 1
