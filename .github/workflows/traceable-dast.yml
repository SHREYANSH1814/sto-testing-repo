name: Traceable DAST Security Scan

on:
  workflow_dispatch:
    inputs:
      harness-org-id:
        description: 'Harness Organization ID'
        required: true
        type: string
      harness-project-id:
        description: 'Harness Project ID'
        required: true
        type: string
      harness-domain:
        description: 'Harness domain (e.g., https://app.harness.io)'
        required: false
        type: string
        default: 'https://app.harness.io'

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Run Traceable DAST orchestration scan (auto target)
        id: sto-scan-orchestration
        uses: ./.github/actions/harness-sto
        with:
          harness-token: ${{ secrets.HARNESS_TOKEN }}
          harness-org-id: ${{ inputs.harness-org-id }}
          harness-project-id: ${{ inputs.harness-project-id }}
          harness-domain: ${{ inputs.harness-domain }}

          scanner: traceable
          scan-mode: orchestration
          scan-config: default
          target-type: instance
          scanner-domain: ${{ secrets.TRACEABLE_DOMAIN }}
          scanner-access-token: ${{ secrets.TRACEABLE_ACCESS_TOKEN }}
          scanner-scan-id: ${{ secrets.TRACEABLE_SCAN_ID }}
          output-file: scan-output-orchestration.env
          show-summary: 'true'  

      - name: Run Traceable DAST extraction scan 
        id: sto-scan-extraction
        if: always()
        uses: ./.github/actions/harness-sto
        with:
          harness-token: ${{ secrets.HARNESS_TOKEN }}
          harness-org-id: ${{ inputs.harness-org-id }}
          harness-project-id: ${{ inputs.harness-project-id }}
          harness-domain: ${{ inputs.harness-domain }}

          scanner: traceable
          scan-mode: extraction
          scan-config: default
          target-type: instance
          scanner-domain: ${{ secrets.TRACEABLE_DOMAIN }}
          scanner-access-token: ${{ secrets.TRACEABLE_ACCESS_TOKEN }}
          scanner-scan-id: ${{ secrets.TRACEABLE_SCAN_ID }}
          target-name: "shreyansh/traceabledast"
          target-variant: "main"
          output-file: scan-output-extraction.env
          log-level: Debug
          show-summary: 'true'
   

     

   
      - name: Use scan output variables
        if: always()
        shell: bash
        run: |
          echo "===== STO Scan Output Variables (orchestration) ====="
          echo "Scan ID: ${{ steps.sto-scan-orchestration.outputs.scan-id }}"
          echo "Status: ${{ steps.sto-scan-orchestration.outputs.status }}"
          echo "Total Issues: ${{ steps.sto-scan-orchestration.outputs.total-issues }}"
          echo "Critical: ${{ steps.sto-scan-orchestration.outputs.critical }}"
          echo "High: ${{ steps.sto-scan-orchestration.outputs.high }}"
          echo "Medium: ${{ steps.sto-scan-orchestration.outputs.medium }}"
          echo "Low: ${{ steps.sto-scan-orchestration.outputs.low }}"
          echo "Info: ${{ steps.sto-scan-orchestration.outputs.info }}"
          echo "Output File Path: ${{ steps.sto-scan-orchestration.outputs.output-file-path }}"

          echo "===== STO Scan Output Variables (extraction) ====="
          echo "Scan ID: ${{ steps.sto-scan-extraction.outputs.scan-id }}"
          echo "Status: ${{ steps.sto-scan-extraction.outputs.status }}"
          echo "Total Issues: ${{ steps.sto-scan-extraction.outputs.total-issues }}"
          echo "Critical: ${{ steps.sto-scan-extraction.outputs.critical }}"
          echo "High: ${{ steps.sto-scan-extraction.outputs.high }}"
          echo "Medium: ${{ steps.sto-scan-extraction.outputs.medium }}"
          echo "Low: ${{ steps.sto-scan-extraction.outputs.low }}"
          echo "Info: ${{ steps.sto-scan-extraction.outputs.info }}"
          echo "Output File Path: ${{ steps.sto-scan-extraction.outputs.output-file-path }}"

      - name: Archive scan output (orchestration)
        if: always() && steps.sto-scan-orchestration.outputs.output-file-path != ''
        uses: actions/upload-artifact@v4
        with:
          name: sto-scan-results-orchestration
          path: ${{ steps.sto-scan-orchestration.outputs.output-file-path }}
          retention-days: 1

      - name: Archive scan output (extraction)
        if: always() && steps.sto-scan-extraction.outputs.output-file-path != ''
        uses: actions/upload-artifact@v4
        with:
          name: sto-scan-results-extraction
          path: ${{ steps.sto-scan-extraction.outputs.output-file-path }}
          retention-days: 1
