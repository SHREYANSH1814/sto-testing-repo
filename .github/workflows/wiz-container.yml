name: Wiz Container Security Scan

on:
  workflow_dispatch:
    inputs:
      harness-org-id:
        description: 'Harness Organization ID'
        required: true
        type: string
      harness-project-id:
        description: 'Harness Project ID'
        required: true
        type: string
      harness-domain:
        description: 'Harness domain (e.g., https://app.harness.io)'
        required: false
        type: string
        default: 'https://app.harness.io'

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Run Wiz container scan with default target
        id: sto-scan-default
        uses: ./.github/actions/harness-sto
        with:
          harness-token: ${{ secrets.HARNESS_TOKEN }}
          harness-org-id: ${{ inputs.harness-org-id }}
          harness-project-id: ${{ inputs.harness-project-id }}
          harness-domain: ${{ inputs.harness-domain }}

          scanner: wiz
          scan-mode: orchestration
          scan-config: default
          target-type: container
          image-name: "nirocr/nodegoat"
          image-tag: "latest"
          image-access-id: ${{ secrets.PRIVATE_DOCKER_ACCESS_ID }}
          image-access-token: ${{ secrets.PRIVATE_DOCKER_ACCESS_TOKEN }}
          scanner-access-id: ${{ secrets.WIZ_ACCESS_ID }}
          scanner-access-token: ${{ secrets.WIZ_ACCESS_TOKEN }}
          docker-image-tag: "dev"
          output-file: scan-output-default.env
          show-summary: 'true'

      - name: Run Wiz container scan with named target
        id: sto-scan-container
        if: always()
        uses: ./.github/actions/harness-sto
        with:
          harness-token: ${{ secrets.HARNESS_TOKEN }}
          harness-org-id: ${{ inputs.harness-org-id }}
          harness-project-id: ${{ inputs.harness-project-id }}
          harness-domain: ${{ inputs.harness-domain }}

          scanner: wiz
          scan-mode: orchestration
          scan-config: default
          target-type: container
          image-name: "nirocr/nodegoat"
          image-tag: "latest"
          image-access-id: ${{ secrets.PRIVATE_DOCKER_ACCESS_ID }}
          image-access-token: ${{ secrets.PRIVATE_DOCKER_ACCESS_TOKEN }}
          scanner-access-id: ${{ secrets.WIZ_ACCESS_ID }}
          scanner-access-token: ${{ secrets.WIZ_ACCESS_TOKEN }}
          target-name: "shreyansh/wizcontainer"
          target-variant: "latest"
          docker-image-tag: "dev"
          output-file: scan-output-container.env
          show-summary: 'true'

      - name: Use scan output variables
        if: always()
        shell: bash
        run: |
          echo "===== STO Scan Output Variables (default) ====="
          echo "Scan ID: ${{ steps.sto-scan-default.outputs.scan-id }}"
          echo "Status: ${{ steps.sto-scan-default.outputs.status }}"
          echo "Total Issues: ${{ steps.sto-scan-default.outputs.total-issues }}"
          echo "Critical: ${{ steps.sto-scan-default.outputs.critical }}"
          echo "High: ${{ steps.sto-scan-default.outputs.high }}"
          echo "Medium: ${{ steps.sto-scan-default.outputs.medium }}"
          echo "Low: ${{ steps.sto-scan-default.outputs.low }}"
          echo "Info: ${{ steps.sto-scan-default.outputs.info }}"
          echo "Output File Path: ${{ steps.sto-scan-default.outputs.output-file-path }}"

          echo "===== STO Scan Output Variables (container) ====="
          echo "Scan ID: ${{ steps.sto-scan-container.outputs.scan-id }}"
          echo "Status: ${{ steps.sto-scan-container.outputs.status }}"
          echo "Total Issues: ${{ steps.sto-scan-container.outputs.total-issues }}"
          echo "Critical: ${{ steps.sto-scan-container.outputs.critical }}"
          echo "High: ${{ steps.sto-scan-container.outputs.high }}"
          echo "Medium: ${{ steps.sto-scan-container.outputs.medium }}"
          echo "Low: ${{ steps.sto-scan-container.outputs.low }}"
          echo "Info: ${{ steps.sto-scan-container.outputs.info }}"
          echo "Output File Path: ${{ steps.sto-scan-container.outputs.output-file-path }}"

      - name: Archive scan output (default)
        if: always() && steps.sto-scan-default.outputs.output-file-path != ''
        uses: actions/upload-artifact@v4
        with:
          name: sto-scan-results-default
          path: ${{ steps.sto-scan-default.outputs.output-file-path }}
          retention-days: 1

      - name: Archive scan output (container)
        if: always() && steps.sto-scan-container.outputs.output-file-path != ''
        uses: actions/upload-artifact@v4
        with:
          name: sto-scan-results-container
          path: ${{ steps.sto-scan-container.outputs.output-file-path }}
          retention-days: 1
