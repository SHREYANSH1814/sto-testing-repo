name: SonarQube Orchestration Security Scan

on:
  workflow_dispatch:
    inputs:
      harness-org-id:
        description: 'Harness Organization ID'
        required: true
        type: string
      harness-project-id:
        description: 'Harness Project ID'
        required: true
        type: string
      harness-domain:
        description: 'Harness domain (e.g., https://app.harness.io)'
        required: false
        type: string
        default: 'https://app.harness.io'

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Run SonarQube orchestration scan with default target
        id: sto-scan-default
        uses: ./.github/actions/harness-sto
        with:
          harness-token: ${{ secrets.HARNESS_TOKEN }}
          harness-org-id: ${{ inputs.harness-org-id }}
          harness-project-id: ${{ inputs.harness-project-id }}
          harness-domain: ${{ inputs.harness-domain }}

          scanner: sonarqube
          scan-mode: orchestration
          scan-config: default
          target-type: repository
          workspace: .
          scanner-access-token: ${{ secrets.SONAR_TOKEN }}
          scanner-domain: ${{ secrets.SONAR_DOMAIN }}
          scanner-project-name: ${{ secrets.SONAR_PROJECT_NAME }}
          docker-image-tag: "dev"
          output-file: scan-output-default.env
          show-summary: 'true'

      - name: Run SonarQube orchestration scan with named target
        id: sto-scan-orchestration
        if: always()
        uses: ./.github/actions/harness-sto
        with:
          harness-token: ${{ secrets.HARNESS_TOKEN }}
          harness-org-id: ${{ inputs.harness-org-id }}
          harness-project-id: ${{ inputs.harness-project-id }}
          harness-domain: ${{ inputs.harness-domain }}

          scanner: sonarqube
          scan-mode: orchestration
          scan-config: default
          target-type: repository
          workspace: .
          scanner-access-token: ${{ secrets.SONAR_TOKEN }}
          scanner-domain: ${{ secrets.SONAR_DOMAIN }}
          scanner-project-name: ${{ secrets.SONAR_PROJECT_NAME }}
          target-name: "shreyansh/sonarorchestration"
          target-variant: "main"
          docker-image-tag: "dev"
          output-file: scan-output-orchestration.env
          show-summary: 'true'

      - name: Use scan output variables
        if: always()
        shell: bash
        run: |
          echo "===== STO Scan Output Variables (default) ====="
          echo "Scan ID: ${{ steps.sto-scan-default.outputs.scan-id }}"
          echo "Status: ${{ steps.sto-scan-default.outputs.status }}"
          echo "Total Issues: ${{ steps.sto-scan-default.outputs.total-issues }}"
          echo "Critical: ${{ steps.sto-scan-default.outputs.critical }}"
          echo "High: ${{ steps.sto-scan-default.outputs.high }}"
          echo "Medium: ${{ steps.sto-scan-default.outputs.medium }}"
          echo "Low: ${{ steps.sto-scan-default.outputs.low }}"
          echo "Info: ${{ steps.sto-scan-default.outputs.info }}"
          echo "Output File Path: ${{ steps.sto-scan-default.outputs.output-file-path }}"

          echo "===== STO Scan Output Variables (orchestration) ====="
          echo "Scan ID: ${{ steps.sto-scan-orchestration.outputs.scan-id }}"
          echo "Status: ${{ steps.sto-scan-orchestration.outputs.status }}"
          echo "Total Issues: ${{ steps.sto-scan-orchestration.outputs.total-issues }}"
          echo "Critical: ${{ steps.sto-scan-orchestration.outputs.critical }}"
          echo "High: ${{ steps.sto-scan-orchestration.outputs.high }}"
          echo "Medium: ${{ steps.sto-scan-orchestration.outputs.medium }}"
          echo "Low: ${{ steps.sto-scan-orchestration.outputs.low }}"
          echo "Info: ${{ steps.sto-scan-orchestration.outputs.info }}"
          echo "Output File Path: ${{ steps.sto-scan-orchestration.outputs.output-file-path }}"

      - name: Archive scan output (default)
        if: always() && steps.sto-scan-default.outputs.output-file-path != ''
        uses: actions/upload-artifact@v4
        with:
          name: sto-scan-results-default
          path: ${{ steps.sto-scan-default.outputs.output-file-path }}
          retention-days: 1

      - name: Archive scan output (orchestration)
        if: always() && steps.sto-scan-orchestration.outputs.output-file-path != ''
        uses: actions/upload-artifact@v4
        with:
          name: sto-scan-results-orchestration
          path: ${{ steps.sto-scan-orchestration.outputs.output-file-path }}
          retention-days: 1
