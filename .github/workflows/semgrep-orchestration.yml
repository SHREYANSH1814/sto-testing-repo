          harness-org-id: ${{ inputs.harness-org-id }}
          harness-project-id: ${{ inputs.harness-project-id }}
          harness-domain: ${{ inputs.harness-domain }}

          scanner: semgrep
          scan-mode: orchestration
          scan-config: auto-only
          target-type: repository
          workspace: .
          docker-image-tag: "dev"
          output-file: scan-output-auto-only-default.env
          show-summary: 'true'

      - name: Run Semgrep auto-only scan with named target
        id: sto-scan-auto-only
        if: always()
        uses: ./.github/actions/harness-sto
        with:
          harness-token: ${{ secrets.HARNESS_TOKEN }}
          harness-org-id: ${{ inputs.harness-org-id }}
          harness-project-id: ${{ inputs.harness-project-id }}
          harness-domain: ${{ inputs.harness-domain }}

          scanner: semgrep
          scan-mode: orchestration
          scan-config: auto-only
          target-type: repository
          workspace: .
          docker-image-tag: "dev"
          target-name: "shreyansh/semgrepautoonly"
          target-variant: "main"
          output-file: scan-output-auto-only.env
          show-summary: 'true'

      - name: Run Semgrep p-default scan with default target
        id: sto-scan-p-default-default
        if: always()
        uses: ./.github/actions/harness-sto
        with:
          harness-token: ${{ secrets.HARNESS_TOKEN }}
          harness-org-id: ${{ inputs.harness-org-id }}
          harness-project-id: ${{ inputs.harness-project-id }}
          harness-domain: ${{ inputs.harness-domain }}

          scanner: semgrep
          scan-mode: orchestration
          scan-config: p-default
          target-type: repository
          workspace: .
          docker-image-tag: "dev"
          output-file: scan-output-p-default-default.env
          show-summary: 'true'

      - name: Run Semgrep p-default scan with named target
        id: sto-scan-p-default
        if: always()
        uses: ./.github/actions/harness-sto
        with:
          harness-token: ${{ secrets.HARNESS_TOKEN }}
          harness-org-id: ${{ inputs.harness-org-id }}
          harness-project-id: ${{ inputs.harness-project-id }}
          harness-domain: ${{ inputs.harness-domain }}

          scanner: semgrep
          scan-mode: orchestration
          scan-config: p-default
          target-type: repository
          workspace: .
          docker-image-tag: "dev"
          target-name: "shreyansh/semgreppdefault"
          target-variant: "main"
          output-file: scan-output-p-default.env
          show-summary: 'true'

      - name: Run Semgrep no-default-cli-flags scan with default target
        id: sto-scan-no-default-cli-flags-default
