name: Semgrep Orchestration Security Scan

on:
  workflow_dispatch:
    inputs:
      harness-org-id:
        description: 'Harness Organization ID'
        required: true
        type: string
      harness-project-id:
        description: 'Harness Project ID'
        required: true
        type: string
      harness-domain:
        description: 'Harness domain (e.g., https://app.harness.io)'
        required: false
        type: string
        default: 'https://app.harness.io'

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Run Semgrep scan-third-party-dependencies scan with default target
        id: sto-scan-third-party-default
        uses: ./.github/actions/harness-sto
        with:
          harness-token: ${{ secrets.HARNESS_TOKEN }}
          harness-org-id: ${{ inputs.harness-org-id }}
          harness-project-id: ${{ inputs.harness-project-id }}
          harness-domain: ${{ inputs.harness-domain }}

          scanner: semgrep
          scan-mode: orchestration
          scan-config: scan-third-party-dependencies
          target-type: repository
          workspace: .
          docker-image-tag: "dev"
          output-file: scan-output-third-party-default.env
          show-summary: 'true'

      - name: Run Semgrep scan-third-party-dependencies scan with named target
        id: sto-scan-third-party
        if: always()
        uses: ./.github/actions/harness-sto
        with:
          harness-token: ${{ secrets.HARNESS_TOKEN }}
          harness-org-id: ${{ inputs.harness-org-id }}
          harness-project-id: ${{ inputs.harness-project-id }}
          harness-domain: ${{ inputs.harness-domain }}

          scanner: semgrep
          scan-mode: orchestration
          scan-config: scan-third-party-dependencies
          target-type: repository
          workspace: .
          docker-image-tag: "dev"
          target-name: "shreyansh/semgrepthirdparty"
          target-variant: "main"
          output-file: scan-output-third-party.env
          show-summary: 'true'

      - name: Run Semgrep auto-and-ported-security-tools-except-p-gitleaks scan with default target
        id: sto-scan-auto-ported-except-gitleaks-default
        if: always()
        uses: ./.github/actions/harness-sto
        with:
          harness-token: ${{ secrets.HARNESS_TOKEN }}
          harness-org-id: ${{ inputs.harness-org-id }}
          harness-project-id: ${{ inputs.harness-project-id }}
          harness-domain: ${{ inputs.harness-domain }}

          scanner: semgrep
          scan-mode: orchestration
          scan-config: auto-and-ported-security-tools-except-p-gitleaks
          target-type: repository
          workspace: .
          docker-image-tag: "dev"
          output-file: scan-output-auto-ported-except-gitleaks-default.env
          show-summary: 'true'

      - name: Run Semgrep auto-and-ported-security-tools-except-p-gitleaks scan with named target
        id: sto-scan-auto-ported-except-gitleaks
        if: always()
        uses: ./.github/actions/harness-sto
        with:
          harness-token: ${{ secrets.HARNESS_TOKEN }}
          harness-org-id: ${{ inputs.harness-org-id }}
          harness-project-id: ${{ inputs.harness-project-id }}
          harness-domain: ${{ inputs.harness-domain }}

          scanner: semgrep
          scan-mode: orchestration
          scan-config: auto-and-ported-security-tools-except-p-gitleaks
          target-type: repository
          workspace: .
          docker-image-tag: "dev"
          target-name: "shreyansh/semgrepautoportedexceptgitleaks"
          target-variant: "main"
          output-file: scan-output-auto-ported-except-gitleaks.env
          show-summary: 'true'

      - name: Run Semgrep auto-and-ported-security-tools scan with default target
