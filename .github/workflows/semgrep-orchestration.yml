          echo "Status: ${{ steps.sto-scan-auto-only.outputs.status }}"
          echo "Total Issues: ${{ steps.sto-scan-auto-only.outputs.total-issues }}"
          echo "Critical: ${{ steps.sto-scan-auto-only.outputs.critical }}"
