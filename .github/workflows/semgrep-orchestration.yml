          echo "Total Issues: ${{ steps.sto-scan-p-default-default.outputs.total-issues }}"
          echo "Critical: ${{ steps.sto-scan-p-default-default.outputs.critical }}"
          echo "High: ${{ steps.sto-scan-p-default-default.outputs.high }}"
          echo "Medium: ${{ steps.sto-scan-p-default-default.outputs.medium }}"
          echo "Low: ${{ steps.sto-scan-p-default-default.outputs.low }}"
          echo "Info: ${{ steps.sto-scan-p-default-default.outputs.info }}"
          echo "Output File Path: ${{ steps.sto-scan-p-default-default.outputs.output-file-path }}"

          echo "===== STO Scan Output Variables (p-default) ====="
