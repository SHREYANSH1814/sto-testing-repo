name: Brakeman Orchestration Security Scan

on:
  workflow_dispatch:
    inputs:
      harness-org-id:
        description: 'Harness Organization ID'
        required: true
        type: string
      harness-project-id:
        description: 'Harness Project ID'
        required: true
        type: string
      harness-domain:
        description: 'Harness domain (e.g., https://app.harness.io)'
        required: false
        type: string
        default: 'https://app.harness.io'

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Run Brakeman default scan with default target
        id: sto-scan-default
        uses: ./.github/actions/harness-sto
        with:
          harness-token: ${{ secrets.HARNESS_TOKEN }}
          harness-org-id: ${{ inputs.harness-org-id }}
          harness-project-id: ${{ inputs.harness-project-id }}
          harness-domain: ${{ inputs.harness-domain }}

          scanner: brakeman
          scan-mode: orchestration
          scan-config: default
          target-type: repository
          workspace: ./rails
          docker-image-tag: "dev"
          output-file: scan-output-default.env
          show-summary: 'true'

      - name: Run Brakeman default scan with named target
        id: sto-scan-default-named
        if: always()
        uses: ./.github/actions/harness-sto
        with:
          harness-token: ${{ secrets.HARNESS_TOKEN }}
          harness-org-id: ${{ inputs.harness-org-id }}
          harness-project-id: ${{ inputs.harness-project-id }}
          harness-domain: ${{ inputs.harness-domain }}

          scanner: brakeman
          scan-mode: orchestration
          scan-config: default
          target-type: repository
          workspace: ./rails
          target-name: "shreyansh/brakemandefault"
          target-variant: "main"
          docker-image-tag: "dev"
          output-file: scan-output-default-named.env
          show-summary: 'true'

      - name: Run Brakeman brakeman-default scan with default target
        id: sto-scan-brakeman-default
        if: always()
        uses: ./.github/actions/harness-sto
        with:
          harness-token: ${{ secrets.HARNESS_TOKEN }}
          harness-org-id: ${{ inputs.harness-org-id }}
          harness-project-id: ${{ inputs.harness-project-id }}
          harness-domain: ${{ inputs.harness-domain }}

          scanner: brakeman
          scan-mode: orchestration
          scan-config: brakeman-default
          target-type: repository
          workspace: ./rails
          docker-image-tag: "dev"
          output-file: scan-output-brakeman-default.env
          show-summary: 'true'

      - name: Run Brakeman brakeman-default scan with named target
        id: sto-scan-brakeman-default-named
        if: always()
        uses: ./.github/actions/harness-sto
        with:
          harness-token: ${{ secrets.HARNESS_TOKEN }}
          harness-org-id: ${{ inputs.harness-org-id }}
          harness-project-id: ${{ inputs.harness-project-id }}
          harness-domain: ${{ inputs.harness-domain }}

          scanner: brakeman
          scan-mode: orchestration
          scan-config: brakeman-default
          target-type: repository
          workspace: ./rails
          target-name: "shreyansh/brakemanbrakemandefault"
          target-variant: "main"
          docker-image-tag: "dev"
          output-file: scan-output-brakeman-default-named.env
          show-summary: 'true'

      - name: Use scan output variables
        if: always()
        shell: bash
        run: |
          echo "===== STO Scan Output Variables (default target) ====="
          echo "Scan ID: ${{ steps.sto-scan-default.outputs.scan-id }}"
          echo "Status: ${{ steps.sto-scan-default.outputs.status }}"
          echo "Total Issues: ${{ steps.sto-scan-default.outputs.total-issues }}"
          echo "Critical: ${{ steps.sto-scan-default.outputs.critical }}"
          echo "High: ${{ steps.sto-scan-default.outputs.high }}"
          echo "Medium: ${{ steps.sto-scan-default.outputs.medium }}"
          echo "Low: ${{ steps.sto-scan-default.outputs.low }}"
          echo "Info: ${{ steps.sto-scan-default.outputs.info }}"
          echo "Output File Path: ${{ steps.sto-scan-default.outputs.output-file-path }}"

          echo "===== STO Scan Output Variables (default named) ====="
          echo "Scan ID: ${{ steps.sto-scan-default-named.outputs.scan-id }}"
          echo "Status: ${{ steps.sto-scan-default-named.outputs.status }}"
          echo "Total Issues: ${{ steps.sto-scan-default-named.outputs.total-issues }}"
          echo "Critical: ${{ steps.sto-scan-default-named.outputs.critical }}"
          echo "High: ${{ steps.sto-scan-default-named.outputs.high }}"
          echo "Medium: ${{ steps.sto-scan-default-named.outputs.medium }}"
          echo "Low: ${{ steps.sto-scan-default-named.outputs.low }}"
          echo "Info: ${{ steps.sto-scan-default-named.outputs.info }}"
          echo "Output File Path: ${{ steps.sto-scan-default-named.outputs.output-file-path }}"

          echo "===== STO Scan Output Variables (brakeman-default target) ====="
          echo "Scan ID: ${{ steps.sto-scan-brakeman-default.outputs.scan-id }}"
          echo "Status: ${{ steps.sto-scan-brakeman-default.outputs.status }}"
          echo "Total Issues: ${{ steps.sto-scan-brakeman-default.outputs.total-issues }}"
          echo "Critical: ${{ steps.sto-scan-brakeman-default.outputs.critical }}"
          echo "High: ${{ steps.sto-scan-brakeman-default.outputs.high }}"
          echo "Medium: ${{ steps.sto-scan-brakeman-default.outputs.medium }}"
          echo "Low: ${{ steps.sto-scan-brakeman-default.outputs.low }}"
          echo "Info: ${{ steps.sto-scan-brakeman-default.outputs.info }}"
          echo "Output File Path: ${{ steps.sto-scan-brakeman-default.outputs.output-file-path }}"

          echo "===== STO Scan Output Variables (brakeman-default named) ====="
          echo "Scan ID: ${{ steps.sto-scan-brakeman-default-named.outputs.scan-id }}"
          echo "Status: ${{ steps.sto-scan-brakeman-default-named.outputs.status }}"
          echo "Total Issues: ${{ steps.sto-scan-brakeman-default-named.outputs.total-issues }}"
          echo "Critical: ${{ steps.sto-scan-brakeman-default-named.outputs.critical }}"
          echo "High: ${{ steps.sto-scan-brakeman-default-named.outputs.high }}"
          echo "Medium: ${{ steps.sto-scan-brakeman-default-named.outputs.medium }}"
          echo "Low: ${{ steps.sto-scan-brakeman-default-named.outputs.low }}"
          echo "Info: ${{ steps.sto-scan-brakeman-default-named.outputs.info }}"
          echo "Output File Path: ${{ steps.sto-scan-brakeman-default-named.outputs.output-file-path }}"

      - name: Archive scan output (default)
        if: always() && steps.sto-scan-default.outputs.output-file-path != ''
        uses: actions/upload-artifact@v4
        with:
          name: sto-scan-results-default
          path: ${{ steps.sto-scan-default.outputs.output-file-path }}
          retention-days: 1

      - name: Archive scan output (default named)
        if: always() && steps.sto-scan-default-named.outputs.output-file-path != ''
        uses: actions/upload-artifact@v4
        with:
          name: sto-scan-results-default-named
          path: ${{ steps.sto-scan-default-named.outputs.output-file-path }}
          retention-days: 1

      - name: Archive scan output (brakeman-default)
        if: always() && steps.sto-scan-brakeman-default.outputs.output-file-path != ''
        uses: actions/upload-artifact@v4
        with:
          name: sto-scan-results-brakeman-default
          path: ${{ steps.sto-scan-brakeman-default.outputs.output-file-path }}
          retention-days: 1

      - name: Archive scan output (brakeman-default named)
        if: always() && steps.sto-scan-brakeman-default-named.outputs.output-file-path != ''
        uses: actions/upload-artifact@v4
        with:
          name: sto-scan-results-brakeman-default-named
          path: ${{ steps.sto-scan-brakeman-default-named.outputs.output-file-path }}
          retention-days: 1
