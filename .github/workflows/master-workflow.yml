name: STO Scanner Master Workflow

on:
  workflow_dispatch:
    inputs:
      harness-org-id:
        description: 'Harness Organization ID'
        required: true
        type: string
      harness-project-id:
        description: 'Harness Project ID'
        required: true
        type: string
      harness-domain:
        description: 'Harness domain (e.g., https://app.harness.io)'
        required: false
        type: string
        default: 'https://app.harness.io'
      scanners:
        description: "Use 'all', or a JSON array of scanner names (e.g. [\"gitleaks-scanner\",\"bandit-scanner\"])."
        required: true
        type: string
        default: 'all'
      exclude:
        description: "Scanners to skip: comma-separated or JSON array (e.g. aquatrivy-scanner,snyk-scanner). Applied after 'scanners'. Blank = none."
        required: false
        type: string
        default: ''
      max_parallel:
        description: 'Maximum concurrent scanners (1-30)'
        required: true
        type: number
        default: 10

permissions:
  actions: write
  contents: read

jobs:
  # ====================================================================
  # prepare - validate selection, apply excludes, emit scanner matrix.
  #           Each entry carries {name, file, expected}:
  #             expected = "success"  -> scanner must pass (default)
  #             expected = "failure"  -> NEGATIVE test; must fail
  #           Edit EXPECT_FAIL below to mark negative-scenario workflows.
  # ====================================================================
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.prepare.outputs.matrix }}
      max_parallel: ${{ steps.prepare.outputs.max_parallel }}
    steps:
      - name: Validate and prepare inputs
        id: prepare
        env:
          SCANNER_INPUT: ${{ inputs.scanners }}
          EXCLUDE_INPUT: ${{ inputs.exclude }}
          MAX_PARALLEL: ${{ inputs.max_parallel }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os

          # name (workflow file stem) -> actual workflow filename.
          # Only real, dispatchable scan workflows on this branch.
          NAME_TO_FILE = {
              "anchore-scanner": "anchore-scanner.yml",
              "aquatrivy-scanner": "aquatrivy-scanner.yml",
              "bandit-scanner": "bandit-scanner.yml",
              "blackduck-scanner": "blackduck-scanner.yml",
              "brakeman-scanner": "brakeman-scanner.yml",
              "checkov-scanner": "checkov-scanner.yml",
              "codeql-scanner": "codeql-scanner.yml",
              "ghas-scanner": "ghas-scanner.yml",
              "gitleaks-scanner": "gitleaks-scanner.yml",
              "grype-scanner": "grype-scanner.yml",
              "harness-sast-scanner": "harness-sast-scanner.yml",
              "harness-sca-scanner": "harness-sca-scanner.yml",
              "modelscan-scanner": "modelscan-scanner.yml",
              "nikto-scanner": "nikto-scanner.yml",
              "osv-scanner": "osv-scanner.yml",
              "owasp-scanner": "owasp-scanner.yml",
              "prisma-cloud-scanner": "prisma-cloud-scanner.yml",
              "security-scan": "security-scan.yml",
              "semgrep-scanner": "semgrep-scanner.yml",
              "snyk-scanner": "snyk-scanner.yml",
              "sonarqube-scanner": "sonarqube-scanner.yml",
              "traceable-scanner": "traceable-scanner.yml",
              "wiz-scanner": "wiz-scanner.yml",
              "zap-scanner": "zap-scanner.yml",
          }

          # Negative-scenario workflows: EXPECTED to fail. A child-run
          # conclusion of "failure" is treated as PASSED; "success" as FAILED.
          # >>> Add any other negative-test workflow names here. <<<
          EXPECT_FAIL = set()

          def norm(x):
              """Normalize an entry: drop any path and a .yml/.yaml suffix.
              So 'harness-sast-orchestration', '.../harness-sast-orchestration.yml'
              and 'zap-orchestration.yaml' all reduce to the scanner name."""
              x = str(x).strip()
              x = x.rsplit("/", 1)[-1]          # strip any path / URL prefix
              if x.endswith(".yml"):
                  x = x[:-4]
              elif x.endswith(".yaml"):
                  x = x[:-5]
              return x

          def parse_list(raw):
              """Accept a JSON array or a comma-separated string.
              Entries may include a .yml/.yaml extension or a path."""
              raw = raw.strip()
              if not raw:
                  return []
              if raw.startswith("["):
                  try:
                      v = json.loads(raw)
                  except json.JSONDecodeError:
                      raise SystemExit(f"Invalid JSON array: {raw}")
                  if not isinstance(v, list):
                      raise SystemExit("Expected a JSON array")
                  items = v
              else:
                  items = raw.split(",")
              return [norm(p) for p in items if norm(p)]

          raw = os.environ["SCANNER_INPUT"].strip()
          limit = int(os.environ["MAX_PARALLEL"])
          if not 1 <= limit <= 30:
              raise SystemExit("max_parallel must be between 1 and 30")

          if raw.lower() == "all":
              selected = list(NAME_TO_FILE.keys())
          else:
              selected = parse_list(raw)

          if not selected:
              raise SystemExit("Select at least one scanner")
          if len(selected) != len(set(selected)):
              raise SystemExit("Duplicate scanners are not allowed")

          invalid = sorted(set(selected) - set(NAME_TO_FILE))
          if invalid:
              raise SystemExit(f"Invalid scanners: {invalid}\nValid: {sorted(NAME_TO_FILE)}")

          # Apply excludes.
          exclude = parse_list(os.environ.get("EXCLUDE_INPUT", ""))
          bad_excl = sorted(set(exclude) - set(NAME_TO_FILE))
          if bad_excl:
              raise SystemExit(f"Invalid exclude names: {bad_excl}\nValid: {sorted(NAME_TO_FILE)}")
          excl = set(exclude)
          final = [s for s in selected if s not in excl]
          if not final:
              raise SystemExit("All selected scanners were excluded - nothing to run")

          unknown_neg = sorted(EXPECT_FAIL - set(NAME_TO_FILE))
          if unknown_neg:
              raise SystemExit(f"EXPECT_FAIL names not in scanner list: {unknown_neg}")

          matrix = [{
              "name": s,
              "file": NAME_TO_FILE[s],
              "expected": "failure" if s in EXPECT_FAIL else "success",
          } for s in final]
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("matrix=" + json.dumps(matrix) + "\n")
              f.write(f"max_parallel={limit}\n")
          print(f"Running {len(final)} scanner(s): {final}")
          if excl:
              print(f"Excluded: {sorted(excl & set(selected))}")
          print(f"Negative tests (expected to fail): {sorted(EXPECT_FAIL & set(final))}")
          print(f"Max parallel: {limit}")
          PY

  # ====================================================================
  # run-scanners - one matrix job per scanner (parallel, throttled by
  #                max_parallel). Marks PASSED when the actual conclusion
  #                matches the expected outcome.
  # ====================================================================
  run-scanners:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.prepare.outputs.max_parallel) }}
      matrix:
        scanner: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    name: ${{ matrix.scanner.name }}
    steps:
      - name: Dispatch and monitor scanner
        id: scanner
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SCANNER: ${{ matrix.scanner.name }}
          WF_FILE: ${{ matrix.scanner.file }}
          EXPECTED: ${{ matrix.scanner.expected }}
          ORG_ID: ${{ inputs.harness-org-id }}
          PROJECT_ID: ${{ inputs.harness-project-id }}
          DOMAIN: ${{ inputs.harness-domain }}
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p results
          RESULT="results/${SCANNER}.json"
          RUN_ID=""; RUN_URL=""; CONCLUSION="unknown"; STATUS="FAILED"

          save_result() {
            python3 - "$RESULT" <<PY
          import json, sys
          json.dump({
            "scanner": "$SCANNER", "file": "$WF_FILE",
            "expected": "$EXPECTED", "conclusion": "$CONCLUSION",
            "status": "$STATUS", "run_id": "$RUN_ID", "url": "$RUN_URL"
          }, open(sys.argv[1], "w"))
          PY
          }

          START="$(date -u -d '-15 seconds' +%Y-%m-%dT%H:%M:%SZ)"

          if ! gh workflow run "$WF_FILE" \
               --repo "$REPO" --ref "$BRANCH" \
               -f harness-org-id="$ORG_ID" \
               -f harness-project-id="$PROJECT_ID" \
               -f harness-domain="$DOMAIN"; then
            echo "Dispatch failed: $SCANNER ($WF_FILE)"
            save_result; exit 1
          fi

          for i in $(seq 1 30); do
            RUN_ID="$(gh run list --repo "$REPO" --workflow "$WF_FILE" \
              --branch "$BRANCH" --event workflow_dispatch --limit 20 \
              --json databaseId,createdAt \
              --jq "map(select(.createdAt > \"$START\")) | sort_by(.createdAt) | last | .databaseId" 2>/dev/null || true)"
            [ -n "$RUN_ID" ] && [ "$RUN_ID" != "null" ] && break
            RUN_ID=""; sleep 3
          done
          if [ -z "$RUN_ID" ]; then
            echo "Could not find child run: $SCANNER"
            save_result; exit 1
          fi
          RUN_URL="https://github.com/${REPO}/actions/runs/${RUN_ID}"
          echo "Run: $RUN_URL"

          gh run watch "$RUN_ID" --repo "$REPO" --interval 15 >/dev/null 2>&1 || true
          CONCLUSION="$(gh run view "$RUN_ID" --repo "$REPO" --json conclusion --jq '.conclusion' 2>/dev/null || echo unknown)"

          if [ "$EXPECTED" = "failure" ]; then
            if [ "$CONCLUSION" = "failure" ]; then STATUS="PASSED"; else STATUS="FAILED"; fi
          else
            if [ "$CONCLUSION" = "success" ]; then STATUS="PASSED"; else STATUS="FAILED"; fi
          fi

          save_result
          echo "Scanner: $SCANNER | expected=$EXPECTED | conclusion=$CONCLUSION | status=$STATUS"
          [ "$STATUS" = "PASSED" ]

      - name: Upload scanner result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scanner-result-${{ matrix.scanner.name }}
          path: results/${{ matrix.scanner.name }}.json
          if-no-files-found: warn
          retention-days: 7

  # ====================================================================
  # summary - merge results, print table (incl. expected), and assert
  #           every scanner matched its expected outcome.
  # ====================================================================
  summary:
    name: Scanner Execution Summary
    if: always()
    needs: [prepare, run-scanners]
    runs-on: ubuntu-latest
    steps:
      - name: Download scanner results
        uses: actions/download-artifact@v4
        with:
          pattern: scanner-result-*
          path: results
          merge-multiple: true

      - name: Generate summary
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, json, os
          results = []
          for path in glob.glob("results/*.json"):
              try: results.append(json.load(open(path)))
              except (ValueError, OSError): pass
          results.sort(key=lambda x: x.get("scanner", ""))

          out = open(os.environ["GITHUB_STEP_SUMMARY"], "a")
          out.write("# Scanner Execution Summary\n\n")
          out.write("| Scanner | Status | Run |\n")
          out.write("|---|---|---|\n")
          for r in results:
              url = r.get("url", "")
              link = f"[View run]({url})" if url else "Unavailable"
              out.write(f"| {r.get('scanner','')} | **{r.get('status','')}** | {link} |\n")
          passed = sum(r.get("status")=="PASSED" for r in results)
          failed = len(results)-passed
          out.write(f"\n**Total:** {len(results)} | **Passed:** {passed} | **Failed:** {failed}\n")
          print(f"Results collected: {len(results)}")
          PY

      - name: Assert all scanners matched expected outcome
        env:
          MATRIX: ${{ needs.prepare.outputs.matrix }}
        run: |
          python3 - <<'PY'
          import glob, json, os, sys
          expected = {e["name"]: e["expected"] for e in json.loads(os.environ["MATRIX"])}
          results = {}
          for path in glob.glob("results/*.json"):
              try:
                  r = json.load(open(path)); results[r["scanner"]] = r
              except (ValueError, OSError, KeyError): pass

          problems = []
          for s, exp in expected.items():
              r = results.get(s)
              if r is None:
                  problems.append(f"{s}: no result")
              elif r.get("status") != "PASSED":
                  problems.append(f"{s}: expected={exp} conclusion={r.get('conclusion')} -> {r.get('status')}")

          if problems:
              print("Scanners that did not match expected outcome:")
              for p in problems: print("  -", p)
              sys.exit(1)
          print(f"All {len(expected)} scanner(s) matched their expected outcome.")
          PY
