        if: always()
        uses: ./.github/actions/harness-sto
        with:
          harness-token: ${{ secrets.HARNESS_TOKEN }}
          harness-org-id: ${{ inputs.harness-org-id }}
          harness-project-id: ${{ inputs.harness-project-id }}
          harness-domain: ${{ inputs.harness-domain }}

          scanner: semgrep
          scan-mode: orchestration
          scan-config: auto-and-ported-security-tools
          target-type: repository
          workspace: .
          docker-image-tag: "dev"
          output-file: scan-output-auto-ported-default.env
          show-summary: 'true'

      - name: Run Semgrep auto-and-ported-security-tools scan with named target
        id: sto-scan-auto-ported
        if: always()
        uses: ./.github/actions/harness-sto
        with:
          harness-token: ${{ secrets.HARNESS_TOKEN }}
          harness-org-id: ${{ inputs.harness-org-id }}
          harness-project-id: ${{ inputs.harness-project-id }}
          harness-domain: ${{ inputs.harness-domain }}

          scanner: semgrep
          scan-mode: orchestration
          scan-config: auto-and-ported-security-tools
          target-type: repository
          workspace: .
          docker-image-tag: "dev"
          target-name: "shreyansh/semgrepautoported"
          target-variant: "main"
          output-file: scan-output-auto-ported.env
          show-summary: 'true'

      - name: Run Semgrep auto-only scan with default target
